version: "2"
linters:
  default: all
  disable:
    - dogsled
    - exhaustruct
    - exhaustruct_v5 # deprecated exhaustruct's v2.13 replacement; keep disabled too
    - gochecknoglobals
    - gochecknoinits
    - godot
    - godox
    - gomodguard # deprecated (v2.12), replaced by gomodguard_v2 below
    - ireturn
    - nlreturn
    - noinlineerr # inline error handling (if err := ...; err != nil) is idiomatic across this repo
    - nonamedreturns
    - paralleltest
    - recvcheck
    - testpackage
    - thelper
    - varnamelen
    - wrapcheck
    - wsl # deprecated (v2.2), replaced by wsl_v5
  settings:
    cyclop:
      max-complexity: 20
      package-average: 0
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/gogo/protobuf
              desc: gogo/protobuf is deprecated, use golang/protobuf
    errcheck:
      check-type-assertions: true
      check-blank: false
    exhaustive:
      check:
        - switch
        - map
    funlen:
      lines: 80
      statements: 40
    gocritic:
      settings:
        captLocal:
          paramsOnly: false
        underef:
          skipRecvDeref: false
    gomoddirectives:
      replace-allow-list:
        - gorm.io/gorm
    gomodguard_v2:
      blocked:
        - module: github.com/golang/protobuf
          recommendations:
            - google.golang.org/protobuf
          reason: see https://developers.google.com/protocol-buffers/docs/reference/go/faq#modules
        - module: github.com/satori/go.uuid
          recommendations:
            - github.com/google/uuid
          reason: satori's package is not maintained
        - module: github.com/gofrs/uuid
          recommendations:
            - github.com/google/uuid
          reason: gofrs' package is not go module
    gosec:
      config:
        global:
          audit: true
          nosec: true
    govet:
      disable:
        - fieldalignment
      enable-all: true
      settings:
        shadow:
          strict: false
    lll:
      line-length: 160
      tab-width: 1
    misspell:
      locale: US
      ignore-rules:
        - cancelled
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-no-explanation:
        - funlen
        - gocognit
        - lll
    rowserrcheck:
      packages:
        - github.com/jmoiron/sqlx
    unparam:
      check-exported: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - lll
        path: compilation_test\.go$
      - linters:
          - dupl
          - err113
          - errcheck
          - exhaustive
          - forcetypeassert
          - funlen
          - goconst
          - mnd
          - noctx
        path: _test\.go$|^test/
      - linters:
          - err113
        path: ^cmd/|^cql-gen/cmd/
      - linters:
          - err113
          - errcheck
          - forcetypeassert
        path: ^pkg/analyzer/|^cqllint/pkg/analyzer/
      - linters:
          - staticcheck
        text: 'SA1019: package github.com/golang/protobuf/jsonpb'
      - linters:
          - staticcheck
        text: 'SA1019: "github.com/golang/protobuf/jsonpb"'
      - path: (.+)\.go$
        text: composite literal uses unkeyed fields
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/FrancoLiberali/)
    goimports:
      local-prefixes:
        - github.com/FrancoLiberali/
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
