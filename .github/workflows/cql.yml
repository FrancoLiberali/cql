name: cql
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - cql-gen/**
      - cqllint/**
      - docs/**

# Least privilege at the workflow level; write scopes are granted per-job below.
permissions:
  contents: read

jobs:
  branch-naming-rules:
    name: Check branch name
    runs-on: ubuntu-latest
    steps:
      - uses: deepakputhraya/action-branch-name@master
        with:
          regex: '(^(feature|bugfix|improvement|library|prerelease|release|hotfix|poc)\/[a-z0-9_.-]+$|^dependabot)'
          allowed_prefixes: 'feature,bugfix,improvement,library,prerelease,release,hotfix,poc,dependabot'
          ignore: main,dev
          min_length: 5
          max_length: 50

  check-style:
    name: Code style
    needs: [branch-naming-rules]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: go.sum
      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          only-new-issues: true
          skip-cache: true
          skip-save-cache: true

  test:
    name: test
    needs: [check-style]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # dorny/test-reporter creates a check run
    strategy:
      fail-fast: false
      matrix:
        db: [postgresql, cockroachdb, mysql, sqlite, sqlserver]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v3
        with:
          go-version: '1.23'
          cache: true
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0
      - name: Start containers
        run: docker compose -f "docker/${{ matrix.db }}/docker-compose.yml" up -d
        if: ${{ matrix.db != 'sqlite' }}
      - uses: kanga333/variable-mapper@master
        id: export
        with:
          key: ${{ matrix.db }}
          map: |
            {
              "postgresql": {
                "dialector": "postgres"
              },
              "cockroachdb": {
                "dialector": "postgres"
              },
              "mysql": {
                "dialector": "mysql"
              },
              "sqlite": {
                "dialector": "sqlite"
              },
              "sqlserver": {
                "dialector": "sqlserver"
              }
            }
          export_to: env
      - name: Run test
        # GODEBUG=x509negativeserial=1: the sqlserver container's self-signed
        # cert has a negative serial number, which Go 1.23+ rejects by default
        # (matches the Makefile's test_sqlserver target). No-op for other DBs.
        run:  GODEBUG=x509negativeserial=1 DB=${{ env.dialector }} gotestsum --junitfile tests-${{ matrix.db }}.xml ./... -tags=${{ matrix.db }} -coverpkg=./... -coverprofile=coverage_${{ matrix.db }}.out
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always() # run this step even if previous steps failed
        with:
          name: ${{ matrix.db }} Tests Report  # Name of the check run which will be created
          path: tests-${{ matrix.db }}.xml     # Path to test results
          reporter: java-junit                 # Format of test results
      - uses: actions/upload-artifact@v4
        with:
          name: coverage_${{ matrix.db }}.out
          path: coverage_${{ matrix.db }}.out
      - name: Stop containers
        if: ${{ matrix.db != 'sqlite' }}
        run: docker stop cql-test-db

  sonarcloud:
    name: SonarCloud
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # dawidd6/action-download-artifact reads other workflows' runs
      id-token: write # OIDC for the SonarQube scan action
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Download line coverage reports
        uses: actions/download-artifact@v5
        with:
          pattern: coverage_*
          path: .
          merge-multiple: true
      - name: Download gen line coverage report
        id: download-gen-artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: gen.yml
          workflow_conclusion: success
          name: coverage_gen
          # gen.yml / lint.yml only run on cql-gen/** or cqllint/** changes;
          # when this PR doesn't touch them the last run's artifact may be
          # expired. Don't fail SonarCloud over a missing sub-coverage report.
          if_no_artifact_found: warn
      - name: Download lint line coverage report
        id: download-lint-artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: lint.yml
          workflow_conclusion: success
          name: coverage_lint
          if_no_artifact_found: warn
      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
