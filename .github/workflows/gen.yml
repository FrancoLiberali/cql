name: gen
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
    - cql-gen/**

jobs:
  check-style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: go.sum
      - name: lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          only-new-issues: true
          working-directory: cql-gen
          args: --config=../.golangci.yml
          skip-cache: true
          skip-save-cache: true
      # cql-gen/tests is a separate module (fixtures + generated goldens), so it
      # needs its own golangci-lint run — the step above only lints cql-gen.
      - name: lint tests
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          only-new-issues: true
          working-directory: cql-gen/tests
          args: --config=../../.golangci.yml
          skip-cache: true
          skip-save-cache: true

  test:
    name: Test
    needs: [check-style]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v3
        with:
          go-version: '1.23'
          cache: true
      # Compile the generated golden files (fixtures + results package). The
      # golden tests only byte-compare, so a generator change that produces
      # non-compiling code (e.g. a has-many loader referencing an FK field the
      # conditions struct never defines) would otherwise pass unnoticed.
      - name: Compile generated golden results
        run: go build ./cql-gen/tests/...
      - name: Run tests
        run: go test ./cql-gen/tests -coverpkg=./cql-gen/... -coverprofile=coverage_gen.out -v
      - uses: actions/upload-artifact@v4
        with:
          name: coverage_gen
          path: coverage_gen.out